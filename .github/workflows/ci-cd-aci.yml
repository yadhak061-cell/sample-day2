name: Build Push Deploy to ACI

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Build and Push Image
      run: |
        ACR_LOGIN=$(az acr show -n ${{ secrets.ACR_NAME }} -g ${{ secrets.AZURE_RESOURCE_GROUP }} --query loginServer -o tsv)
        IMAGE_TAG=$ACR_LOGIN/web-demo:${GITHUB_SHA::8}
        docker build -t $IMAGE_TAG ./app
        az acr login -n ${{ secrets.ACR_NAME }}
        docker push $IMAGE_TAG
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

    - name: Deploy to ACI
      run: |
        ACR_LOGIN=$(az acr show -n ${{ secrets.ACR_NAME }} -g ${{ secrets.AZURE_RESOURCE_GROUP }} --query loginServer -o tsv)
        if az container show -g ${{ secrets.AZURE_RESOURCE_GROUP }} -n web-demo-aci &>/dev/null; then
          az container delete -g ${{ secrets.AZURE_RESOURCE_GROUP }} -n web-demo-aci --yes
        fi
        az container create \
          -g ${{ secrets.AZURE_RESOURCE_GROUP }} \
          -n web-demo-aci \
          --image $IMAGE_TAG \
          --os-type Linux \
          --cpu 1 \
          --memory 1.5 \
          --dns-name-label webdemo-prod \
          --ports 80 \
          --registry-login-server $ACR_LOGIN \
          --assign-identity \
          --restart-policy Always

    - name: Show FQDN
      run: |
        az container show -g ${{ secrets.AZURE_RESOURCE_GROUP }} -n web-demo-aci --query "ipAddress.fqdn" -o tsv